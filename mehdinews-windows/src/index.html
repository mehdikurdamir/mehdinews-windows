<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MehdiNews</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <div class="wordmark">MehdiNews</div>
        <div class="tagline">اخبار فناوری به زبان فارسی</div>
      </div>
      <nav id="cats" class="cats" aria-label="دسته‌بندی اخبار"></nav>
      <div class="side-foot">
        <button id="btn-theme" class="ghost" title="تغییر تم">تم تیره/روشن</button>
        <button id="btn-settings" class="ghost">منابع و تنظیمات</button>
      </div>
    </aside>

    <main class="main">
      <header class="bar">
        <input id="q" type="search" placeholder="جستجو در عنوان و خلاصه خبرها…" aria-label="جستجو" />
        <select id="src" aria-label="منبع خبر"><option value="">همه منابع</option></select>
        <button id="btn-refresh" class="primary">به‌روزرسانی</button>
      </header>
      <div id="status" class="status"></div>
      <section id="list" class="list" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="dlg">
    <form method="dialog" id="dlg-body">
      <h2>منابع و تنظیمات</h2>
      <p class="hint">منابع خبری فعال را انتخاب کنید یا آدرس RSS یک سایت دیگر را اضافه کنید.</p>
      <ul id="sources" class="sources"></ul>
      <div class="add">
        <input id="add-name" placeholder="نام منبع" />
        <input id="add-url" placeholder="https://example.com/feed" dir="ltr" />
        <button type="button" id="add-btn">افزودن</button>
      </div>
      <label class="row">دریافت خودکار اخبار هر
        <select id="interval">
          <option value="10">۱۰ دقیقه</option>
          <option value="20">۲۰ دقیقه</option>
          <option value="30">۳۰ دقیقه</option>
          <option value="60">۱ ساعت</option>
          <option value="180">۳ ساعت</option>
        </select>
      </label>
      <div class="dlg-actions">
        <button type="button" id="reset-btn" class="ghost-d">بازگردانی منابع پیش‌فرض</button>
        <span class="spacer"></span>
        <button type="button" id="cancel-btn" class="ghost-d">انصراف</button>
        <button type="button" id="save-btn" class="primary">ذخیره و به‌روزرسانی</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
